name: Feature Request
description: Suggest a feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem_description
    attributes:
      label: Problem Description
      description: Describe the problem or use case this feature would solve
      placeholder: "Describe the problem you're trying to solve..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see
      placeholder: "Describe your proposed solution..."
    validations:
      required: true
  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions you've considered
      placeholder: "Describe alternatives..."
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any additional context or information
      placeholder: "Add any other relevant information..."
    validations:
      required: false
